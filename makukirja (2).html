<title>Makukirja</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column, phone first. Sticky title bar, tinted filter panel (flavor chips, ingredient tokens), recipe cards. Detail, editor and the ingredients screen replace the list as full views, routed by hash. Flavor hues are the only saturated colors; the accent is a quiet green. */
:root {
  --bg: #F2F4F1;
  --surface: #FFFFFF;
  --surface-2: #E7ECE6;
  --fg: #17201B;
  --muted: #5A685F;
  --line: #D3DBD3;
  --accent: #1E6B57;
  --accent-fg: #FFFFFF;
  --danger: #B3372B;
  --f-sweet: #D6457F;
  --f-sour: #A3A60E;
  --f-salty: #3F7FB5;
  --f-bitter: #7A5BB0;
  --f-umami: #B25A2C;
  --f-spicy: #D93A25;
  --f-smoky: #6F6F6A;
  --f-herbal: #3F9142;
  --f-rich: #D49A1C;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111713;
    --surface: #1A221D;
    --surface-2: #222C26;
    --fg: #E8EFEA;
    --muted: #9AA9A0;
    --line: #2F3B34;
    --accent: #5CC2A3;
    --accent-fg: #0B1F18;
    --danger: #F08A7E;
    --f-sweet: #F07AA8;
    --f-sour: #CFD34A;
    --f-salty: #6FA8DC;
    --f-bitter: #A58BD8;
    --f-umami: #D98A5C;
    --f-spicy: #F26B55;
    --f-smoky: #A3A39C;
    --f-herbal: #6CC46F;
    --f-rich: #EDB84A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111713;
  --surface: #1A221D;
  --surface-2: #222C26;
  --fg: #E8EFEA;
  --muted: #9AA9A0;
  --line: #2F3B34;
  --accent: #5CC2A3;
  --accent-fg: #0B1F18;
  --danger: #F08A7E;
  --f-sweet: #F07AA8;
  --f-sour: #CFD34A;
  --f-salty: #6FA8DC;
  --f-bitter: #A58BD8;
  --f-umami: #D98A5C;
  --f-spicy: #F26B55;
  --f-smoky: #A3A39C;
  --f-herbal: #6CC46F;
  --f-rich: #EDB84A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.5 var(--body);
  padding-block: 0 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--bg);
}
.wrap { max-width: 640px; margin: 0 auto; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.cap { display: inline-block; }
.cap::first-letter { text-transform: uppercase; }

/* Title bar */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-block: 14px 10px;
}
.top h1, .top h2 {
  font: 700 26px/1.1 var(--display);
  letter-spacing: -0.01em;
  min-width: 0;
  text-wrap: balance;
}
.top h2 { font-size: 18px; text-align: center; flex: 1; }
.top h2.left { text-align: left; }
.acts { display: flex; gap: 8px; flex: none; }

/* Buttons */
.btn {
  min-height: 44px;
  padding: 0 16px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
}
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.btn.quiet { background: transparent; border-color: transparent; color: var(--muted); }
.btn.danger { color: var(--danger); }
.btn.sm { min-height: 36px; padding: 0 10px; font-size: 13px; }
.btn[disabled] { opacity: 0.55; cursor: default; }

/* Fields */
.field, .group { display: grid; gap: 6px; min-width: 0; border: 0; padding: 0; margin: 0; }
.lbl { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 0; }
.hint { font-size: 13px; color: var(--muted); }
input, textarea, select {
  width: 100%;
  min-height: 44px;
  font: inherit;
  font-size: 16px;
  color: var(--fg);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  appearance: none;
}
select {
  padding-right: 8px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
}
textarea { resize: vertical; line-height: 1.45; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.8; }
.chk { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.chk input { width: 22px; min-height: 22px; height: 22px; padding: 0; appearance: auto; flex: none; margin: 1px 0 0; accent-color: var(--accent); }

/* Filter panel */
.search { margin-block: 4px 12px; }
.find { background: var(--surface-2); border-radius: 14px; padding: 4px 14px 14px; margin-bottom: 18px; }
.find > summary {
  list-style: none;
  cursor: pointer;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-weight: 600;
  font-size: 14px;
}
.find > summary::-webkit-details-marker { display: none; }
.find > summary::after { content: "Piilota"; font-weight: 500; font-size: 13px; color: var(--muted); }
.find:not([open]) > summary::after { content: "Näytä"; }
.find:not([open]) { padding-bottom: 4px; }
.badge {
  display: inline-block; min-width: 20px; padding: 1px 6px; margin-left: 8px;
  border-radius: 999px; background: var(--accent); color: var(--accent-fg);
  font-size: 12px; text-align: center; font-variant-numeric: tabular-nums;
}
.find .group + .group { margin-top: 16px; }

/* Flavor chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 40px; padding: 0 14px 0 12px;
  border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer;
  font-weight: 500; font-size: 14px;
}
.chip .dot, .ftag .dot {
  width: 11px; height: 11px; border-radius: 50%;
  border: 2px solid var(--c); background: transparent; flex: none;
}
.chip[aria-pressed="true"], .chip.lv1, .chip.lv2, .chip.lv3 {
  border-color: var(--c);
  background: var(--surface-2);
  background: color-mix(in srgb, var(--c) 16%, var(--surface));
  font-weight: 600;
}
.chip[aria-pressed="true"] .dot, .chip.lv1 .dot, .chip.lv2 .dot, .chip.lv3 .dot { background: var(--c); }
.f-sweet { --c: var(--f-sweet); } .f-sour { --c: var(--f-sour); } .f-salty { --c: var(--f-salty); }
.f-bitter { --c: var(--f-bitter); } .f-umami { --c: var(--f-umami); } .f-spicy { --c: var(--f-spicy); }
.f-smoky { --c: var(--f-smoky); } .f-herbal { --c: var(--f-herbal); } .f-rich { --c: var(--f-rich); }
.pips { display: inline-grid; grid-auto-flow: column; gap: 2px; }
.pips i { width: 8px; height: 4px; border-radius: 2px; background: var(--line); }
.pips i.on { background: var(--c); }

/* Ingredient picker, tokens, mode switch */
.addrow { display: flex; gap: 8px; align-items: flex-start; }
.pick { flex: 1; min-width: 0; display: grid; }
.sugg { display: grid; gap: 4px; margin-top: 6px; }
.sugg:empty { display: none; }
.sugg button {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  width: 100%; min-height: 44px; padding: 0 12px; text-align: left;
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
  font-size: 15px; cursor: pointer;
}
.sugg button .u { color: var(--muted); font-size: 13px; }
.sugg button.new { border-style: dashed; border-color: var(--accent); color: var(--accent); font-weight: 600; justify-content: flex-start; }
.tokens { display: flex; flex-wrap: wrap; gap: 8px; }
.tokens:empty { display: none; }
.tok {
  display: inline-flex; align-items: center; gap: 4px;
  min-height: 36px; padding: 0 4px 0 12px;
  border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
  font-size: 14px; font-weight: 500;
}
.tok button {
  width: 32px; height: 32px; border: 0; background: transparent; cursor: pointer;
  color: var(--muted); font-size: 18px; line-height: 1; border-radius: 6px;
}
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); justify-self: start; }
.seg button { min-height: 40px; padding: 0 14px; border: 0; background: transparent; font-size: 14px; font-weight: 500; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 600; }

/* Results */
.rhead { display: flex; align-items: center; justify-content: space-between; min-height: 36px; margin-bottom: 8px; color: var(--muted); font-size: 13px; font-weight: 500; }
.list { display: grid; gap: 12px; }
.card {
  display: grid; gap: 8px; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px; text-decoration: none; color: inherit;
}
.card:active { background: var(--surface-2); }
.card h3 { font: 600 19px/1.2 var(--display); text-wrap: balance; overflow-wrap: anywhere; }
.card .head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.tag { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; flex: none; }
.meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ftags { display: flex; flex-wrap: wrap; gap: 6px 12px; }
.ftag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
.ing-line { font-size: 13px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.ing-line b { font-weight: 600; }
.ing-line .miss { color: var(--muted); }
.empty { padding: 28px 8px; text-align: center; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
.empty strong { color: var(--fg); font: 600 18px/1.3 var(--display); }
.note { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }

/* Detail */
.detail { display: grid; gap: 22px; }
.detail h2.title { font: 700 30px/1.1 var(--display); letter-spacing: -0.01em; text-wrap: balance; overflow-wrap: anywhere; }
.sec { display: grid; gap: 10px; }
.sechead { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.stepper { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.stepper .ctl { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.stepper .ctl button { width: 44px; min-height: 44px; border: 0; background: transparent; font-size: 20px; cursor: pointer; }
.stepper .ctl input { width: 52px; min-height: 44px; border: 0; border-radius: 0; text-align: center; padding: 0; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.stepper .ctl input::-webkit-outer-spin-button, .stepper .ctl input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.profile { display: grid; gap: 8px; }
.prow { display: grid; grid-template-columns: 96px 1fr 84px; align-items: center; gap: 10px; font-size: 14px; }
.prow .nm { display: flex; align-items: center; gap: 7px; font-weight: 500; }
.prow .lvl { color: var(--muted); font-size: 13px; text-align: right; }
.meter { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.meter i { height: 10px; border-radius: 3px; background: var(--line); }
.meter i.on { background: var(--c); }
.ingl { list-style: none; margin: 0; padding: 0; }
.ingl li { display: grid; grid-template-columns: 82px 1fr auto; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
.ingl .amt { font-weight: 600; font-variant-numeric: tabular-nums; }
.ingl .amt.soft { font-weight: 400; color: var(--muted); font-size: 13px; }
.ingl li.plain { grid-template-columns: 1fr; }
.have { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 10px; }
.steps li::before { content: counter(s); font: 700 20px/1.2 var(--display); color: var(--accent); font-variant-numeric: tabular-nums; }
.notes-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-top: 8px; }

/* Editor */
.form { display: grid; gap: 18px; padding-bottom: 8px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.err { color: var(--danger); font-size: 13px; font-weight: 500; }
.err:empty { display: none; }
.rows { display: grid; gap: 10px; }
.irow { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); min-width: 0; }
.ihead { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
.ihead .name { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.line2 { display: grid; grid-template-columns: 1fr 92px 44px; gap: 8px; align-items: center; }
.line2 .btn { padding: 0; font-size: 20px; }
.confirm { display: grid; gap: 10px; padding: 12px; border-radius: 10px; background: var(--surface-2); }
.confirm .actions { padding-top: 0; }

/* Ingredients screen */
.iadd { display: grid; gap: 8px; margin-top: 4px; }
.iadd .urow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.iadd .urow .btn { margin-left: auto; }
.lrow { border-bottom: 1px solid var(--line); }
.lmain { display: flex; width: 100%; justify-content: space-between; align-items: baseline; gap: 12px; min-height: 48px; padding: 8px 0; border: 0; background: transparent; text-align: left; cursor: pointer; }
.lname { font-size: 16px; font-weight: 500; overflow-wrap: anywhere; }
.lmeta { font-size: 13px; color: var(--muted); text-align: right; }
.lpanel { display: grid; gap: 14px; padding: 12px; margin: 6px 0 12px; border-radius: 12px; background: var(--surface-2); }
.screen { display: grid; gap: 14px; }

#toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  max-width: calc(100% - 32px);
  background: var(--fg); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 500;
  z-index: 30; opacity: 0; pointer-events: none; transition: opacity 0.15s;
}
#toast.show { opacity: 1; }

/* Backup */
.backup { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.backup .btns { display: flex; flex-wrap: wrap; gap: 8px; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>

<div class="wrap">
  <section id="v-list">
    <header class="top">
      <h1>Makukirja</h1>
      <div class="acts">
        <button class="btn" data-act="goings" type="button">Ainekset</button>
        <button class="btn primary" data-act="new" type="button">Uusi resepti</button>
      </div>
    </header>

    <label class="field search">
      <span class="sr">Hae reseptejä</span>
      <input id="q" type="search" placeholder="Hae nimellä tai aineella" autocomplete="off">
    </label>

    <details class="find" id="find" open>
      <summary><span>Maut ja ainekset<span class="badge" id="fbadge" hidden></span></span></summary>
      <div class="group">
        <div class="lbl">Makuprofiili</div>
        <div class="chips" id="flavor-chips"></div>
        <p class="hint" id="flavor-hint"></p>
      </div>
      <div class="group">
        <div class="lbl">Ainekset</div>
        <form class="addrow" id="ing-form" autocomplete="off">
          <div class="pick">
            <input id="ing" class="pick-in" data-ctx="search" enterkeyhint="done" autocapitalize="none" placeholder="Hae aines, esim. tomaatti" aria-label="Lisää aines hakuun">
            <div class="sugg" id="ing-sugg"></div>
          </div>
          <button class="btn" type="submit">Lisää</button>
        </form>
        <div class="tokens" id="ing-tokens"></div>
        <div class="seg" id="ing-mode" role="group" aria-label="Miten aineksia käytetään">
          <button type="button" data-act="mode" data-val="include">Pitää sisältää</button>
          <button type="button" data-act="mode" data-val="pantry">Minulla on nämä</button>
        </div>
        <p class="hint" id="mode-hint"></p>
      </div>
    </details>

    <div id="results"></div>

    <section class="backup" aria-labelledby="bk-h">
      <div class="lbl" id="bk-h">Varmuuskopio</div>
      <p class="hint" id="bk-note">Vie reseptit ja ainekset tiedostoksi laitteellesi tai tuo ne takaisin tiedostosta. Tuonti ei poista mitään.</p>
      <div class="btns">
        <button class="btn" id="bk-export" type="button" data-act="export">Vie varmuuskopio</button>
        <button class="btn" type="button" data-act="import-pick">Tuo varmuuskopio</button>
        <input type="file" id="imp-file" accept=".json,application/json" hidden aria-label="Varmuuskopiotiedosto">
      </div>
      <div id="backup-msg"></div>
    </section>
  </section>

  <section id="v-detail" hidden></section>
  <section id="v-edit" hidden></section>
  <section id="v-ings" hidden></section>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  document.documentElement.lang = 'fi';

  var FLAVORS = [
    { id: 'sweet', name: 'Makea' }, { id: 'sour', name: 'Hapan' }, { id: 'salty', name: 'Suolainen' },
    { id: 'bitter', name: 'Karvas' }, { id: 'umami', name: 'Umami' }, { id: 'spicy', name: 'Tulinen' },
    { id: 'smoky', name: 'Savuinen' }, { id: 'herbal', name: 'Yrttinen' }, { id: 'rich', name: 'Täyteläinen' }
  ];
  var FL = {};
  FLAVORS.forEach(function (f) { FL[f.id] = f; });
  var LEVELS = ['', 'Häivähdys', 'Keskivahva', 'Voimakas'];
  var UNITS = ['g', 'dl', 'kpl'];
  var LS_R = 'makukirja.recipes.v2', LS_I = 'makukirja.ingredients.v2';

  /* PURE:start */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function norm(s) { return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim(); }
  function plain(s) { return String(s == null ? '' : s).trim().toLowerCase(); }
  function lev(a, b) {
    var m = a.length, n = b.length, i, j;
    if (!m) return n;
    if (!n) return m;
    var prev = [], cur = [];
    for (j = 0; j <= n; j++) prev[j] = j;
    for (i = 1; i <= m; i++) {
      cur[0] = i;
      for (j = 1; j <= n; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1));
      }
      var t = prev; prev = cur; cur = t;
    }
    return prev[n];
  }
  function fmtAmt(n, unit) {
    var v = unit === 'g' ? (n >= 10 ? Math.round(n) : Math.round(n * 10) / 10) : Math.round(n * 100) / 100;
    return String(v).replace('.', ',');
  }
  function parseAmt(s) {
    var t = String(s == null ? '' : s).trim().replace(',', '.');
    if (!t) return null;
    if (!/^\d*\.?\d+$/.test(t)) return NaN;
    var n = parseFloat(t);
    return n > 0 ? n : null;
  }
  /* PURE:end */

  var S = {
    recipes: [], ings: [], map: {}, rr: false, ri: false, mode: 'local', cols: null, unsubs: [], slow: false,
    q: '', flavors: [], sel: [], ingMode: 'include',

  /* ---------- backup ---------- */
  /* BK:start */
  var ID_RE = /^[A-Za-z0-9_\-.~:@+]{1,200}$/;
  function isNum(x) { return typeof x === 'number' && isFinite(x); }

  function parseBackup(text, existing, recIds) {
    var data;
    try { data = JSON.parse(text); } catch (e) { return { error: 'Tiedosto ei ole kelvollinen varmuuskopio.' }; }
    if (!data || data.app !== 'makukirja' || !Array.isArray(data.ingredients) || !Array.isArray(data.recipes)) return { error: 'Tämä ei ole Makukirjan varmuuskopio.' };
    if (data.ingredients.length > 2000 || data.recipes.length > 5000) return { error: 'Tiedosto on liian suuri tuotavaksi.' };
    var skipped = 0, merged = 0, replacedI = 0, replacedR = 0, ings = [], recs = [];
    var remap = Object.create(null), byName = Object.create(null), ingIds = Object.create(null);
    var exIds = Object.create(null), exName = Object.create(null), seenI = Object.create(null), seenR = Object.create(null);
    existing.forEach(function (g) { byName[plain(g.name)] = g.id; ingIds[g.id] = true; exIds[g.id] = true; exName[g.id] = plain(g.name); });
    var list = data.ingredients.slice().sort(function (a, b) {
      return (a && exIds[a.id] ? 0 : 1) - (b && exIds[b.id] ? 0 : 1);
    });
    list.forEach(function (g) {
      if (!g || typeof g !== 'object' || typeof g.id !== 'string' || !ID_RE.test(g.id) || seenI[g.id] ||
          typeof g.name !== 'string' || !plain(g.name) || UNITS.indexOf(g.unit) < 0) { skipped++; return; }
      seenI[g.id] = true;
      var nm = plain(g.name), old = exIds[g.id] ? exName[g.id] : null, other = byName[nm];
      if (other && other !== g.id) { remap[g.id] = other; merged++; return; }
      if (old && byName[old] === g.id) delete byName[old];
      byName[nm] = g.id;
      ingIds[g.id] = true;
      if (exIds[g.id]) replacedI++;
      ings.push({ id: g.id, name: nm, unit: g.unit, staple: g.staple === true });
    });
    data.recipes.forEach(function (r) {
      if (!r || typeof r !== 'object' || typeof r.id !== 'string' || !ID_RE.test(r.id) || seenR[r.id] ||
          typeof r.title !== 'string' || !r.title.trim() || !Array.isArray(r.ingredients)) { skipped++; return; }
      var rows = [], bad = false;
      for (var i = 0; i < r.ingredients.length; i++) {
        var x = r.ingredients[i];
        if (!x || typeof x !== 'object' || typeof x.id !== 'string') { bad = true; break; }
        var id = remap[x.id] || x.id;
        if (!ingIds[id] || UNITS.indexOf(x.unit) < 0 || !(x.amount === null || (isNum(x.amount) && x.amount > 0))) { bad = true; break; }
        rows.push({ id: id, amount: x.amount, unit: x.unit });
      }
      if (bad) { skipped++; return; }
      var fl = {};
      if (r.flavors && typeof r.flavors === 'object') {
        Object.keys(r.flavors).forEach(function (k) {

        });
      }
      seenR[r.id] = true;
      if (recIds.indexOf(r.id) > -1) replacedR++;

        id: r.id, title: r.title.trim(),
        time: isNum(r.time) && r.time > 0 ? Math.round(r.time) : 0,
        servings: isNum(r.servings) && r.servings >= 1 ? Math.round(r.servings) : 1,
        flavors: fl, ingredients: rows,
        steps: Array.isArray(r.steps) ? r.steps.filter(function (s) { return typeof s === 'string' && s.trim(); }) : [],
        notes: typeof r.notes === 'string' ? r.notes : '',
        example: r.example === true,

    });

  function initBackup() {

  function doExport() {

  function startImport(file) {
    var msg = $('#backup-msg');
    S.imp = null;
    if (!ready()) { toast('Odota, että reseptit latautuvat.'); return; }
    if (file.size > 5 * 1024 * 1024) { msg.innerHTML = '<p class="err">Tiedosto on liian suuri tuotavaksi.</p>'; return; }
    var fr = new FileReader();
    fr.onerror = function () { msg.innerHTML = '<p class="err">Tiedoston lukeminen epäonnistui.</p>'; };
    fr.onload = function () {
      var res = parseBackup(String(fr.result), S.ings, S.recipes.map(function (x) { return x.id; }));
      if (res.error) { msg.innerHTML = '<p class="err">' + esc(res.error) + '</p>'; return; }
      if (!res.ings.length && !res.recs.length) { msg.innerHTML = '<p class="err">Tiedostossa ei ole tuotavia reseptejä tai aineksia.</p>'; return; }
      S.imp = res;

  function runImport() {

    jobs.reduce(function (p, j) { return p.then(function () { return persistDoc(j[0], j[1]); }); }, Promise.resolve())
      .then(function () {
        S.impBusy = false; S.imp = null;
        $('#backup-msg').innerHTML = '<p class="hint">Tuotu ' + plural(m.recs.length, 'resepti', 'reseptiä') + ' ja ' + plural(m.ings.length, 'aines', 'ainesta') + '.</p>';

  /* ---------- routing ---------- */
  function route() {
    var h = location.hash.replace(/^#/, '');
    if (h === 'new') return { v: 'edit', id: null };
    if (h === 'ainekset') return { v: 'ings', id: null };
    if (h.indexOf('edit-') === 0) return { v: 'edit', id: h.slice(5) };
    if (h.indexOf('recipe-') === 0) return { v: 'detail', id: h.slice(7) };
    return { v: 'list', id: null };
  }
  function showRoute() {
    if (S.view === 'list') S.scroll = window.scrollY;
    var rt = route();
    S.view = rt.v; S.rid = rt.id; S.confirm = false; S.confirmEx = false; S.editBuilt = false; S.serv = null;
    if (!S.impBusy) { S.imp = null; var bm = $('#backup-msg'); if (bm) bm.innerHTML = ''; }
    V.list.hidden = rt.v !== 'list';
    V.detail.hidden = rt.v !== 'detail';
    V.edit.hidden = rt.v !== 'edit';
    V.ings.hidden = rt.v !== 'ings';
    if (rt.v === 'detail') renderDetail();
    else if (rt.v === 'edit') buildEdit();
    else if (rt.v === 'ings') buildIngs();
    else renderList();
    window.scrollTo(0, rt.v === 'list' ? S.scroll : 0);
  }

    if (S.view === 'list') renderList();
    else if (S.view === 'detail') renderDetail();

  }

  /* ---------- events ---------- */
  function focusLater(id) { setTimeout(function () { var el = document.getElementById(id); if (el) el.focus(); }, 0); }
  function pickCtx(ctx, id) {
    if (ctx === 'search') {
      if (S.sel.indexOf(id) < 0) S.sel.push(id);
      $('#ing').value = ''; $('#ing-sugg').innerHTML = '';
      renderList();
    } else if (ctx.indexOf('row:') === 0) {
      var row = rowBy(ctx.slice(4));
      if (!row) return;
      row.id = id; row.text = ''; row.unit = S.map[id].unit;
      S.draft.newIng = null;
      renderRows();
      focusLater('am-' + row.k);
    } else if (ctx === 'merge') {
      S.mergeTarget = id;
      renderIngList();
    }
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act'), val = t.getAttribute('data-val');
    var row, id, r;
    switch (act) {
      case 'flavor':
        var i = S.flavors.indexOf(val);
        if (i > -1) S.flavors.splice(i, 1); else S.flavors.push(val);
        renderList(); break;
      case 'rm-ing': S.sel.splice(parseInt(val, 10), 1); renderList(); break;
      case 'mode': S.ingMode = val; renderList(); break;
      case 'clear': S.q = ''; S.flavors = []; S.sel = []; $('#q').value = ''; renderList(); break;
      case 'new': location.hash = 'new'; break;
      case 'goings': location.hash = 'ainekset'; break;
      case 'export': doExport(); break;
      case 'import-pick': $('#imp-file').click(); break;
      case 'import-yes': runImport(); break;
      case 'import-no': S.imp = null; renderImport(); break;
      case 'back': location.hash = ''; break;
      case 'edit': location.hash = 'edit-' + S.rid; break;
      case 'cancel': location.hash = S.rid ? 'recipe-' + S.rid : ''; break;
      case 'save': doSave(); break;
      case 'efl':
        S.draft.flavors[val] = ((S.draft.flavors[val] || 0) + 1) % 4;
        paintFlavorBtn(t); break;
      case 'serv-': setServ((S.serv || 1) - 1); break;
      case 'serv+': setServ((S.serv || 1) + 1); break;
      case 'del-ask': S.confirm = true; renderDetail(); break;
      case 'del-no': S.confirm = false; renderDetail(); break;
      case 'del-yes':
        removeDoc('recipes', S.rid).then(function () { toast('Resepti poistettu'); location.hash = ''; })
          .catch(function () { toast('Poistaminen epäonnistui. Yritä uudelleen.'); });
        break;
      case 'rm-ex': S.confirmEx = true; renderList(); break;
      case 'rm-ex-no': S.confirmEx = false; renderList(); break;
      case 'rm-ex-yes':
        var ids = S.recipes.filter(function (x) { return x.example; }).map(function (x) { return x.id; });
        S.confirmEx = false;
        ids.reduce(function (p, rid) { return p.then(function () { return removeDoc('recipes', rid); }); }, Promise.resolve())
          .then(function () { toast('Esimerkit poistettu'); onData(); })
          .catch(function () { toast('Kaikkia esimerkkejä ei voitu poistaa.'); onData(); });
        break;
      case 'pick': pickCtx(t.getAttribute('data-ctx'), val); break;
      case 'pick-new':
        row = rowBy(t.getAttribute('data-ctx').slice(4));
        if (!row) break;
        S.draft.newIng = { k: row.k, name: val, unit: 'g' };
        renderRows(); break;
      case 'newunit': S.draft.newIng.unit = val; setPressed(t); break;
      case 'new-no': S.draft.newIng = null; renderRows(); break;
      case 'new-yes':
        var n = S.draft.newIng;
        if (!n) break;
        var ex = exact(n.name);
        var done = function (g) {
          var rw = rowBy(n.k);
          if (rw) { rw.id = g.id; rw.text = ''; rw.unit = g.unit; }
          S.draft.newIng = null;
          renderRows();
          focusLater('am-' + n.k);
        };
        if (ex) { done(ex); break; }
        createIngredient(n.name, n.unit).then(function (g) { toast('Aines lisätty'); done(g); })
          .catch(function () { toast('Lisääminen epäonnistui. Yritä uudelleen.'); });
        break;
      case 'row-change':
        row = rowBy(val);
        if (row) { row.id = null; row.text = ''; renderRows(); focusLater('pi-' + row.k); }
        break;
      case 'row-del':
        S.draft.rows = S.draft.rows.filter(function (x) { return x.k !== val; });
        if (S.draft.newIng && S.draft.newIng.k === val) S.draft.newIng = null;
        if (!S.draft.rows.length) S.draft.rows.push({ k: nk(), id: null, text: '', amount: '', unit: 'g' });
        renderRows(); break;
      case 'row-add':
        row = { k: nk(), id: null, text: '', amount: '', unit: 'g' };
        S.draft.rows.push(row);
        renderRows();
        focusLater('pi-' + row.k); break;
      case 'add-unit': S.addUnit = val; setPressed(t); break;
      case 'add-ing-yes': addIngFromScreen(true); break;
      case 'add-ing-no': $('#add-msg').innerHTML = ''; break;
      case 'ing-open':
        S.editIng = val; S.editUnit = S.map[val] ? S.map[val].unit : 'g';
        S.mergeFor = null; S.mergeTarget = null; S.delIng = null;
        renderIngList(); break;
      case 'ing-close': S.editIng = null; S.mergeFor = null; S.mergeTarget = null; S.delIng = null; renderIngList(); break;
      case 'ing-unit': S.editUnit = val; setPressed(t); break;
      case 'ing-save':
        id = S.editIng;
        var g0 = S.map[id];
        if (!g0) break;
        var nm = plain($('#ie-name').value);
        if (!nm) { toast('Anna ainekselle nimi.'); break; }
        var other = exact(nm);
        if (other && other.id !== id) { toast('Samanniminen aines on jo listassa. Käytä Yhdistä toiseen -toimintoa.'); break; }
        persistDoc('ingredients', { id: id, name: nm, unit: S.editUnit, staple: $('#ie-staple').checked })
          .then(function () { S.editIng = null; toast('Tallennettu'); renderIngList(); })
          .catch(function () { toast('Tallennus epäonnistui. Yritä uudelleen.'); });
        break;
      case 'ing-merge': S.mergeFor = S.editIng; S.mergeTarget = null; renderIngList(); focusLater('merge-in'); break;
      case 'ing-merge-cancel': S.mergeFor = null; S.mergeTarget = null; renderIngList(); break;
      case 'ing-merge-yes':
        var src = S.mergeFor, tgt = S.mergeTarget;
        mergeIng(src, tgt).then(function () {
          S.editIng = null; S.mergeFor = null; S.mergeTarget = null;
          toast('Ainekset yhdistetty'); renderIngList();
        }).catch(function () { toast('Yhdistäminen keskeytyi. Tarkista reseptit ja yritä uudelleen.'); renderIngList(); });
        break;
      case 'ing-del-ask': S.delIng = S.editIng; renderIngList(); break;
      case 'ing-del-no': S.delIng = null; renderIngList(); break;
      case 'ing-del-yes':
        removeDoc('ingredients', S.delIng).then(function () { S.editIng = null; S.delIng = null; toast('Aines poistettu'); renderIngList(); })
          .catch(function () { toast('Poistaminen epäonnistui. Yritä uudelleen.'); });
        break;
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target, box, ctx;
    if (t.classList && t.classList.contains('pick-in')) {
      ctx = t.getAttribute('data-ctx');
      box = t.parentNode.querySelector('.sugg');
      if (ctx.indexOf('row:') === 0) {
        var row = rowBy(ctx.slice(4));
        if (!row) return;
        row.text = t.value;
        if (S.draft.newIng && S.draft.newIng.k === row.k) { S.draft.newIng = null; renderRows(); focusLater('pi-' + row.k); return; }
        box.innerHTML = suggHTML(ctx, t.value, true, usedIds(row.k));
      } else if (ctx === 'search') box.innerHTML = suggHTML(ctx, t.value, false, S.sel);
      else if (ctx === 'merge') box.innerHTML = suggHTML(ctx, t.value, false, [S.mergeFor]);
    } else if (t.getAttribute && t.getAttribute('data-f') === 'amount') {
      var rw = rowBy(t.getAttribute('data-k'));
      if (rw) rw.amount = t.value;
    } else if (t.id === 'serv-in') {
      var v = parseInt(t.value, 10);
      if (v >= 1 && v <= 99) {
        S.serv = v;
        var rr = findR(S.rid);
        if (rr && $('#ingl')) $('#ingl').innerHTML = ingListHTML(rr);
      }
    } else if (t.id === 'ingq') {
      S.ingq = t.value;
      renderIngList();
    }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.getAttribute && t.getAttribute('data-f') === 'unit') {
      var rw = rowBy(t.getAttribute('data-k'));
      if (rw) rw.unit = t.value;
    }
  });
  $('#q').addEventListener('input', function (e) { S.q = e.target.value; renderList(); });
  $('#imp-file').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (f) startImport(f);
    e.target.value = '';
  });
  initBackup();
  $('#ing-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var inp = $('#ing'), txt = inp.value.trim();
    if (!txt) return;
    var g = exact(txt) || suggest(txt).filter(function (x) { return S.sel.indexOf(x.id) < 0; })[0];
    if (g) pickCtx('search', g.id);
    inp.focus();
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id === 'ing-add') { e.preventDefault(); addIngFromScreen(false); }
  });
  window.addEventListener('hashchange', showRoute);

  showRoute();
  init();
})();
</script>
